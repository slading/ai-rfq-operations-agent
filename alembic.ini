# ---------------------------------------------------------------------------
# Alembic configuration - AI RFQ Operations Agent
#
# The database URL is deliberately left empty: env.py falls back to the
# application configuration (RFQ_DATABASE__URL, then .env, then the built-in
# default sqlite:///var/rfq_agent.db). Set `sqlalchemy.url` here, or pass
# `-x db_url=...`, only when you want to override that for a single command -
# which is exactly what the migration tests do.
# ---------------------------------------------------------------------------
[alembic]
script_location = migrations
prepend_sys_path = . src
file_template = %%(rev)s_%%(slug)s
timezone = UTC
path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Formatting is handled by `make format`, which runs ruff over migrations/ too.

# ---------------------------------------------------------------------------
# Logging (used by env.py via logging.config.fileConfig)
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
